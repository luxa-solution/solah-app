name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - production
      - staging
      - main
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.config.ts'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wait-for-branch-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for PR Branch Guard
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload.pull_request.head.sha;
            const checkName = 'branch-guard';
            const maxTries = 30;
            const delayMs = 10000;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            for (let attempt = 1; attempt <= maxTries; attempt++) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                check_name: checkName,
              });

              const run = data.check_runs.find(r => r.name === checkName);

              if (run && run.status === 'completed') {
                if (run.conclusion === 'success') {
                  core.info('Branch guard passed.');
                  return;
                }

                core.setFailed(`Branch guard ${run.conclusion}`);
                return;
              }

              core.info(`Branch guard not finished (try ${attempt}/${maxTries}); waiting ${delayMs / 1000}s`);
              await sleep(delayMs);
            }

            core.setFailed('Branch guard did not complete in time.');

  lint:
    needs: wait-for-branch-guard
    if: needs.wait-for-branch-guard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  test:
    needs: wait-for-branch-guard
    if: needs.wait-for-branch-guard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Run tests
        run: npm run test:ci

      - name: Upsert coverage summary in workflow summary
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const p = 'coverage/coverage-summary.json';
          if (!fs.existsSync(p)) {
            console.log('No coverage summary found at', p);
            process.exit(0);
          }

          const s = JSON.parse(fs.readFileSync(p, 'utf8')).total;
          const pct = (k) => (s?.[k]?.pct ?? 0);
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          const startMarker = '<!-- coverage-summary:start -->';
          const endMarker = '<!-- coverage-summary:end -->';

          const md = [
            startMarker,
            '## 🧪 Test Coverage',
            '',
            '| Metric | % | Covered / Total |',
            '|---|---:|---:|',
            `| Lines | ${pct('lines')}% | ${s.lines.covered}/${s.lines.total} |`,
            `| Statements | ${pct('statements')}% | ${s.statements.covered}/${s.statements.total} |`,
            `| Functions | ${pct('functions')}% | ${s.functions.covered}/${s.functions.total} |`,
            `| Branches | ${pct('branches')}% | ${s.branches.covered}/${s.branches.total} |`,
            endMarker,
          ].join('\n');

          const existing = fs.existsSync(summaryPath) ? fs.readFileSync(summaryPath, 'utf8') : '';
          const blockRegex = new RegExp(`${startMarker}[\\s\\S]*?${endMarker}\\n?`, 'm');
          const next = blockRegex.test(existing)
            ? existing.replace(blockRegex, md + '\n')
            : existing + (existing && !existing.endsWith('\n') ? '\n' : '') + md + '\n';

          fs.writeFileSync(summaryPath, next);
          NODE

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 14

  build:
    needs: wait-for-branch-guard
    if: needs.wait-for-branch-guard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build for preview
        run: npx expo export --platform all

