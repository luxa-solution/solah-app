name: Development PR

on:
  pull_request:
    branches: 
      - 'main'
    paths:
      - src/**
      - app.config.ts
      - package.json
      - assets/**

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:

  update:
    name: Publish development update
    type: update
    environment: development
    params:
      platform: all
      channel: development
      message: "PR #${{ github.event.pull_request.number }}"
      