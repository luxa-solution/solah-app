name: Production Release Build

on:
  pull_request:
    branches: ['production']
    types: [labeled]
    paths:
      - src/**
      - index.js
      - app.config.ts
      - package.json
      - assets/**

jobs:
  build_android_if_labeled:
    name: Build Android (production)
    if: ${{ github.event.label.name == 'build-all' || github.event.label.name == 'build-android' }}
    type: build
    environment: production
    params:
      platform: android
      profile: production

